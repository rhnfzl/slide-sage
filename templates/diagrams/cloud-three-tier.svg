<svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cloud three-tier architecture diagram" id="cloud-three-tier-diagram">
  <title>Cloud Three-Tier Architecture</title>
  <style>
    .ct-band { opacity: 0.12; }
    .ct-box { transition: filter 0.2s ease; cursor: pointer; }
    .ct-box:hover { filter: brightness(1.15) drop-shadow(0 3px 10px rgba(0,0,0,0.3)); }
    .ct-zone-name {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px; font-weight: 700; fill: var(--diagram-text, #ccc);
      writing-mode: vertical-rl; text-orientation: mixed;
    }
    .ct-label { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: var(--diagram-label, #FFFFFF); }
    .ct-db-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: var(--diagram-label, #FFFFFF); }
    .ct-connector { stroke: var(--diagram-arrow, #888); stroke-width: 2; }
  </style>

  <defs>
    <marker id="ct-arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--diagram-arrow, #888)" />
    </marker>
    <filter id="ct-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Zone 1: Internet / CDN -->
  <g id="zone-1-group">
    <rect class="ct-band" x="80" y="20" width="700" height="90" rx="8"
          fill="var(--diagram-primary, #0077BB)" />
    <text id="zone-1-name" x="55" y="70" text-anchor="middle"
          class="ct-zone-name" style="writing-mode:tb; text-orientation:mixed;">Internet</text>
    <rect class="ct-box" x="310" y="38" width="180" height="50" rx="8" ry="8"
          fill="var(--diagram-primary, #0077BB)" filter="url(#ct-shadow)" />
    <text id="app-1-label" x="400" y="69" text-anchor="middle" class="ct-label">CDN / Edge</text>
  </g>

  <!-- Arrow Zone 1 -> Zone 2 -->
  <line x1="400" y1="88" x2="400" y2="140" class="ct-connector" marker-end="url(#ct-arrow)" />

  <!-- Zone 2: Load Balancer -->
  <g id="zone-2-group">
    <rect class="ct-band" x="80" y="130" width="700" height="90" rx="8"
          fill="var(--diagram-secondary, #009988)" />
    <text id="zone-2-name" x="55" y="180" text-anchor="middle"
          class="ct-zone-name" style="writing-mode:tb; text-orientation:mixed;">Load Balancer</text>
    <rect class="ct-box" x="310" y="148" width="180" height="50" rx="8" ry="8"
          fill="var(--diagram-secondary, #009988)" filter="url(#ct-shadow)" />
    <text id="app-2-label" x="400" y="179" text-anchor="middle" class="ct-label">ALB / NLB</text>
  </g>

  <!-- Arrows Zone 2 -> Zone 3 (fan out to 2 app servers) -->
  <line x1="370" y1="198" x2="280" y2="260" class="ct-connector" marker-end="url(#ct-arrow)" />
  <line x1="430" y1="198" x2="520" y2="260" class="ct-connector" marker-end="url(#ct-arrow)" />

  <!-- Zone 3: Application Tier -->
  <g id="zone-3-group">
    <rect class="ct-band" x="80" y="240" width="700" height="100" rx="8"
          fill="var(--diagram-amber, #EE7733)" />
    <text id="zone-3-name" x="55" y="295" text-anchor="middle"
          class="ct-zone-name" style="writing-mode:tb; text-orientation:mixed;">Application</text>

    <!-- App Server 1 -->
    <g id="app-server-1-group">
      <rect class="ct-box" x="180" y="262" width="180" height="50" rx="8" ry="8"
            fill="var(--diagram-amber, #EE7733)" filter="url(#ct-shadow)" />
      <text id="app-3-label" x="270" y="293" text-anchor="middle" class="ct-label">App Server 1</text>
    </g>

    <!-- App Server 2 -->
    <g id="app-server-2-group">
      <rect class="ct-box" x="430" y="262" width="180" height="50" rx="8" ry="8"
            fill="var(--diagram-amber, #EE7733)" filter="url(#ct-shadow)" />
      <text id="app-4-label" x="520" y="293" text-anchor="middle" class="ct-label">App Server 2</text>
    </g>

    <!-- App Server 3 (hidden) -->
    <g id="app-3-group" style="display:none;">
      <rect class="ct-box" x="660" y="262" width="180" height="50" rx="8" ry="8"
            fill="var(--diagram-amber, #EE7733)" filter="url(#ct-shadow)" />
      <text id="app-5-label" x="750" y="293" text-anchor="middle" class="ct-label">App Server 3</text>
    </g>
  </g>

  <!-- Arrows Zone 3 -> Zone 4 -->
  <line x1="270" y1="312" x2="370" y2="380" class="ct-connector" marker-end="url(#ct-arrow)" />
  <line x1="520" y1="312" x2="430" y2="380" class="ct-connector" marker-end="url(#ct-arrow)" />

  <!-- Zone 4: Data Tier -->
  <g id="zone-4-group">
    <rect class="ct-band" x="80" y="360" width="700" height="110" rx="8"
          fill="var(--diagram-purple, #3344AA)" />
    <text id="zone-4-name" x="55" y="420" text-anchor="middle"
          class="ct-zone-name" style="writing-mode:tb; text-orientation:mixed;">Data Tier</text>

    <!-- DB Cylinder 1 -->
    <g id="db-1-group">
      <ellipse cx="400" cy="388" rx="55" ry="12" fill="var(--diagram-purple, #3344AA)" />
      <rect x="345" y="388" width="110" height="40" fill="var(--diagram-purple, #3344AA)" />
      <ellipse cx="400" cy="428" rx="55" ry="12" fill="var(--diagram-purple, #3344AA)" />
      <ellipse cx="400" cy="428" rx="55" ry="12" fill="var(--diagram-shadow, #000000)" fill-opacity="0.20" />
      <text id="db-1-label" x="400" y="414" text-anchor="middle" class="ct-db-label">Primary DB</text>
    </g>

    <!-- DB Cylinder 2 (hidden) -->
    <g id="db-2-group" style="display:none;">
      <ellipse cx="600" cy="388" rx="55" ry="12" fill="var(--diagram-secondary, #009988)" />
      <rect x="545" y="388" width="110" height="40" fill="var(--diagram-secondary, #009988)" />
      <ellipse cx="600" cy="428" rx="55" ry="12" fill="var(--diagram-secondary, #009988)" />
      <ellipse cx="600" cy="428" rx="55" ry="12" fill="var(--diagram-shadow, #000000)" fill-opacity="0.20" />
      <text id="db-2-label" x="600" y="414" text-anchor="middle" class="ct-db-label">Read Replica</text>
    </g>
  </g>
</svg>
