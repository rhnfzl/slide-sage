<svg viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Conversion funnel diagram" id="funnel-diagram">
  <title>Conversion Funnel</title>
  <style>
    .fn-stage { transition: filter 0.2s ease; cursor: pointer; }
    .fn-stage:hover { filter: brightness(1.15) drop-shadow(0 3px 10px rgba(0,0,0,0.3)); }
    .fn-label { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #fff; }
    .fn-value { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: var(--diagram-text, #e0e0e0); }
    .fn-conv { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 500; fill: var(--diagram-text, #ccc); }
    .fn-connector { stroke: var(--diagram-arrow, #888); stroke-width: 2; }
  </style>

  <defs>
    <marker id="fn-arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--diagram-arrow, #888)" />
    </marker>
    <filter id="fn-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Stage 1 (top, widest) -->
  <g id="stage-1-group">
    <polygon class="fn-stage" points="20,10 580,10 540,70 60,70"
             fill="var(--diagram-primary, #4A90D9)" filter="url(#fn-shadow)" />
    <text id="stage-1-label" x="300" y="48" text-anchor="middle" class="fn-label">Awareness</text>
    <text id="stage-1-value" x="560" y="48" text-anchor="end" class="fn-value">10,000</text>
  </g>

  <!-- Conversion rate 1->2 -->
  <text id="conv-1" x="560" y="82" text-anchor="end" class="fn-conv">85%</text>

  <!-- Stage 2 -->
  <g id="stage-2-group">
    <polygon class="fn-stage" points="60,80 540,80 490,140 110,140"
             fill="var(--diagram-secondary, #50C878)" filter="url(#fn-shadow)" />
    <text id="stage-2-label" x="300" y="118" text-anchor="middle" class="fn-label">Interest</text>
    <text id="stage-2-value" x="510" y="118" text-anchor="end" class="fn-value">8,500</text>
  </g>

  <!-- Conversion rate 2->3 -->
  <text id="conv-2" x="510" y="152" text-anchor="end" class="fn-conv">60%</text>

  <!-- Stage 3 -->
  <g id="stage-3-group">
    <polygon class="fn-stage" points="110,150 490,150 430,210 170,210"
             fill="var(--diagram-amber, #F5A623)" filter="url(#fn-shadow)" />
    <text id="stage-3-label" x="300" y="188" text-anchor="middle" class="fn-label">Consideration</text>
    <text id="stage-3-value" x="450" y="188" text-anchor="end" class="fn-value">5,100</text>
  </g>

  <!-- Conversion rate 3->4 -->
  <text id="conv-3" x="450" y="222" text-anchor="end" class="fn-conv">40%</text>

  <!-- Stage 4 -->
  <g id="stage-4-group">
    <polygon class="fn-stage" points="170,220 430,220 380,280 220,280"
             fill="var(--diagram-purple, #9B59B6)" filter="url(#fn-shadow)" />
    <text id="stage-4-label" x="300" y="258" text-anchor="middle" class="fn-label">Intent</text>
    <text id="stage-4-value" x="400" y="258" text-anchor="end" class="fn-value">2,040</text>
  </g>

  <!-- Conversion rate 4->5 -->
  <text id="conv-4" x="400" y="292" text-anchor="end" class="fn-conv">25%</text>

  <!-- Stage 5 (bottom, narrowest - hidden by default) -->
  <g id="stage-5-group" style="display:none;">
    <polygon class="fn-stage" points="220,290 380,290 350,350 250,350"
             fill="var(--diagram-red, #DC5A5A)" filter="url(#fn-shadow)" />
    <text id="stage-5-label" x="300" y="328" text-anchor="middle" class="fn-label">Purchase</text>
    <text id="stage-5-value" x="370" y="328" text-anchor="end" class="fn-value">510</text>
  </g>
</svg>
