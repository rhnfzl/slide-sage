<svg viewBox="0 0 850 350" preserveAspectRatio="xMidYMid meet"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Event-driven publish-subscribe architecture diagram" id="event-pubsub-diagram">
  <title>Event-Driven Pub/Sub Architecture</title>
  <style>
    .ep-box { transition: filter 0.2s ease; cursor: pointer; }
    .ep-box:hover { filter: brightness(1.15) drop-shadow(0 3px 10px rgba(0,0,0,0.3)); }
    .ep-label { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: var(--diagram-label, #FFFFFF); }
    .ep-bus-label { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: var(--diagram-label, #FFFFFF); }
    .ep-topic-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: var(--diagram-text, #e0e0e0); }
    .ep-connector { stroke: var(--diagram-arrow, #888); stroke-width: 2; }
    .ep-bus-outline { fill: none; stroke: var(--diagram-amber, #EE7733); stroke-width: 1.5; opacity: 0.4; }
    @keyframes dash-flow {
      to { stroke-dashoffset: -20; }
    }
    .ep-connector-animated {
      stroke-dasharray: 10, 5;
      animation: dash-flow 0.8s linear infinite;
    }
  </style>

  <defs>
    <marker id="ep-arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--diagram-arrow, #888)" />
    </marker>
    <filter id="ep-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Publisher 1 -->
  <g id="pub-1-group">
    <rect class="ep-box" x="30" y="40" width="140" height="50" rx="8" ry="8"
          fill="var(--diagram-primary, #0077BB)" filter="url(#ep-shadow)" />
    <text id="pub-1-label" x="100" y="71" text-anchor="middle" class="ep-label">Publisher 1</text>
  </g>

  <!-- Publisher 2 -->
  <g id="pub-2-group">
    <rect class="ep-box" x="30" y="120" width="140" height="50" rx="8" ry="8"
          fill="var(--diagram-secondary, #009988)" filter="url(#ep-shadow)" />
    <text id="pub-2-label" x="100" y="151" text-anchor="middle" class="ep-label">Publisher 2</text>
  </g>

  <!-- Publisher 3 -->
  <g id="pub-3-group">
    <rect class="ep-box" x="30" y="200" width="140" height="50" rx="8" ry="8"
          fill="var(--diagram-purple, #3344AA)" filter="url(#ep-shadow)" />
    <text id="pub-3-label" x="100" y="231" text-anchor="middle" class="ep-label">Publisher 3</text>
  </g>

  <!-- Publisher 4 (hidden) -->
  <g id="pub-4-group" style="display:none;">
    <rect class="ep-box" x="30" y="280" width="140" height="50" rx="8" ry="8"
          fill="var(--diagram-red, #CC3311)" filter="url(#ep-shadow)" />
    <text id="pub-4-label" x="100" y="311" text-anchor="middle" class="ep-label">Publisher 4</text>
  </g>

  <!-- Fan-in arrows: Publishers -> Bus -->
  <line x1="170" y1="65" x2="295" y2="130" class="ep-connector ep-connector-animated" marker-end="url(#ep-arrow)" />
  <line x1="170" y1="145" x2="295" y2="155" class="ep-connector ep-connector-animated" marker-end="url(#ep-arrow)" />
  <line x1="170" y1="225" x2="295" y2="185" class="ep-connector ep-connector-animated" marker-end="url(#ep-arrow)" />

  <!-- Event Bus (center) -->
  <g id="bus-group">
    <rect class="ep-box" x="300" y="55" width="250" height="200" rx="10" ry="10"
          fill="var(--diagram-amber, #EE7733)" filter="url(#ep-shadow)" />
    <text id="bus-label" x="425" y="90" text-anchor="middle" class="ep-bus-label">Event Bus</text>

    <!-- Topic dividers and labels -->
    <line x1="320" y1="105" x2="530" y2="105" stroke="color-mix(in srgb, var(--diagram-label, #FFFFFF) 30%, transparent)" stroke-width="1" />
    <rect x="330" y="115" width="190" height="30" rx="6" ry="6" fill="rgba(0,0,0,0.15)" />
    <text id="topic-1" x="425" y="136" text-anchor="middle" class="ep-topic-label">orders.created</text>

    <rect x="330" y="155" width="190" height="30" rx="6" ry="6" fill="rgba(0,0,0,0.15)" />
    <text id="topic-2" x="425" y="176" text-anchor="middle" class="ep-topic-label">payments.processed</text>

    <rect x="330" y="195" width="190" height="30" rx="6" ry="6" fill="rgba(0,0,0,0.15)" />
    <text id="topic-3" x="425" y="216" text-anchor="middle" class="ep-topic-label">users.updated</text>
  </g>

  <!-- Fan-out arrows: Bus -> Subscribers -->
  <line x1="550" y1="130" x2="635" y2="65" class="ep-connector ep-connector-animated" marker-end="url(#ep-arrow)" />
  <line x1="550" y1="155" x2="635" y2="145" class="ep-connector ep-connector-animated" marker-end="url(#ep-arrow)" />
  <line x1="550" y1="185" x2="635" y2="225" class="ep-connector ep-connector-animated" marker-end="url(#ep-arrow)" />

  <!-- Subscriber 1 -->
  <g id="sub-1-group">
    <rect class="ep-box" x="640" y="40" width="140" height="50" rx="8" ry="8"
          fill="var(--diagram-secondary, #009988)" filter="url(#ep-shadow)" />
    <text id="sub-1-label" x="710" y="71" text-anchor="middle" class="ep-label">Subscriber 1</text>
  </g>

  <!-- Subscriber 2 -->
  <g id="sub-2-group">
    <rect class="ep-box" x="640" y="120" width="140" height="50" rx="8" ry="8"
          fill="var(--diagram-primary, #0077BB)" filter="url(#ep-shadow)" />
    <text id="sub-2-label" x="710" y="151" text-anchor="middle" class="ep-label">Subscriber 2</text>
  </g>

  <!-- Subscriber 3 -->
  <g id="sub-3-group">
    <rect class="ep-box" x="640" y="200" width="140" height="50" rx="8" ry="8"
          fill="var(--diagram-red, #CC3311)" filter="url(#ep-shadow)" />
    <text id="sub-3-label" x="710" y="231" text-anchor="middle" class="ep-label">Subscriber 3</text>
  </g>

  <!-- Subscriber 4 (hidden) -->
  <g id="sub-4-group" style="display:none;">
    <rect class="ep-box" x="640" y="280" width="140" height="50" rx="8" ry="8"
          fill="var(--diagram-purple, #3344AA)" filter="url(#ep-shadow)" />
    <text id="sub-4-label" x="710" y="311" text-anchor="middle" class="ep-label">Subscriber 4</text>
  </g>
</svg>
