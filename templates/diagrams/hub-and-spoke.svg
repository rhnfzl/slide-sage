<svg viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hub and spoke architecture diagram" id="hub-spoke-diagram">
  <title>Hub and Spoke Architecture</title>
  <style>
    .hs-box { transition: filter 0.2s ease; cursor: pointer; }
    .hs-box:hover { filter: brightness(1.15) drop-shadow(0 3px 10px rgba(0,0,0,0.3)); }
    .hs-hub-label { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #fff; }
    .hs-spoke-label { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #fff; }
    .hs-arrow-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: var(--diagram-text, #e0e0e0); }
    .hs-connector { stroke: var(--diagram-arrow, #888); stroke-width: 2; }
  </style>

  <defs>
    <marker id="hs-arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--diagram-arrow, #888)" />
    </marker>
    <marker id="hs-arrow-rev" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="var(--diagram-arrow, #888)" />
    </marker>
    <filter id="hs-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Hub (Center) -->
  <g id="hub-group">
    <rect class="hs-box" x="220" y="260" width="160" height="80" rx="10" ry="10"
          fill="var(--diagram-primary, #4A90D9)" filter="url(#hs-shadow)" />
    <text id="hub-label" x="300" y="306" text-anchor="middle" class="hs-hub-label">Platform</text>
  </g>

  <!-- Spoke 1: Top (300, 60) -->
  <g id="spoke-1-group">
    <rect class="hs-box" x="240" y="35" width="120" height="50" rx="8" ry="8"
          fill="var(--diagram-secondary, #50C878)" filter="url(#hs-shadow)" />
    <text id="spoke-1-label" x="300" y="66" text-anchor="middle" class="hs-spoke-label">Service A</text>
  </g>
  <!-- Bidirectional arrows: Hub <-> Spoke 1 -->
  <line x1="296" y1="260" x2="296" y2="85" class="hs-connector" marker-end="url(#hs-arrow-rev)" />
  <line x1="304" y1="85" x2="304" y2="260" class="hs-connector" marker-end="url(#hs-arrow-rev)" />
  <text id="spoke-1-arrow-label" x="280" y="175" text-anchor="middle" class="hs-arrow-label"></text>

  <!-- Spoke 2: Top-right (480, 160) -->
  <g id="spoke-2-group">
    <rect class="hs-box" x="420" y="135" width="120" height="50" rx="8" ry="8"
          fill="var(--diagram-amber, #F5A623)" filter="url(#hs-shadow)" />
    <text id="spoke-2-label" x="480" y="166" text-anchor="middle" class="hs-spoke-label">Service B</text>
  </g>
  <!-- Bidirectional arrows: Hub <-> Spoke 2 -->
  <line x1="376" y1="265" x2="424" y2="185" class="hs-connector" marker-end="url(#hs-arrow)" />
  <line x1="420" y1="180" x2="372" y2="270" class="hs-connector" marker-end="url(#hs-arrow)" />
  <text id="spoke-2-arrow-label" x="415" y="218" text-anchor="middle" class="hs-arrow-label"></text>

  <!-- Spoke 3: Bottom-right (480, 360) -->
  <g id="spoke-3-group">
    <rect class="hs-box" x="420" y="335" width="120" height="50" rx="8" ry="8"
          fill="var(--diagram-red, #DC5A5A)" filter="url(#hs-shadow)" />
    <text id="spoke-3-label" x="480" y="366" text-anchor="middle" class="hs-spoke-label">Service C</text>
  </g>
  <!-- Bidirectional arrows: Hub <-> Spoke 3 -->
  <line x1="376" y1="335" x2="424" y2="355" class="hs-connector" marker-end="url(#hs-arrow)" />
  <line x1="420" y1="360" x2="372" y2="340" class="hs-connector" marker-end="url(#hs-arrow)" />
  <text id="spoke-3-arrow-label" x="415" y="380" text-anchor="middle" class="hs-arrow-label"></text>

  <!-- Spoke 4: Bottom (300, 460) -->
  <g id="spoke-4-group">
    <rect class="hs-box" x="240" y="435" width="120" height="50" rx="8" ry="8"
          fill="var(--diagram-purple, #9B59B6)" filter="url(#hs-shadow)" />
    <text id="spoke-4-label" x="300" y="466" text-anchor="middle" class="hs-spoke-label">Service D</text>
  </g>
  <!-- Bidirectional arrows: Hub <-> Spoke 4 -->
  <line x1="296" y1="340" x2="296" y2="435" class="hs-connector" marker-end="url(#hs-arrow)" />
  <line x1="304" y1="435" x2="304" y2="340" class="hs-connector" marker-end="url(#hs-arrow)" />
  <text id="spoke-4-arrow-label" x="280" y="395" text-anchor="middle" class="hs-arrow-label"></text>

  <!-- Spoke 5: Bottom-left (120, 360) -->
  <g id="spoke-5-group">
    <rect class="hs-box" x="60" y="335" width="120" height="50" rx="8" ry="8"
          fill="var(--diagram-secondary, #50C878)" filter="url(#hs-shadow)" />
    <text id="spoke-5-label" x="120" y="366" text-anchor="middle" class="hs-spoke-label">Service E</text>
  </g>
  <!-- Bidirectional arrows: Hub <-> Spoke 5 -->
  <line x1="224" y1="335" x2="176" y2="355" class="hs-connector" marker-end="url(#hs-arrow)" />
  <line x1="180" y1="360" x2="228" y2="340" class="hs-connector" marker-end="url(#hs-arrow)" />
  <text id="spoke-5-arrow-label" x="185" y="380" text-anchor="middle" class="hs-arrow-label"></text>

  <!-- Spoke 6: Top-left (120, 160) -->
  <g id="spoke-6-group">
    <rect class="hs-box" x="60" y="135" width="120" height="50" rx="8" ry="8"
          fill="var(--diagram-amber, #F5A623)" filter="url(#hs-shadow)" />
    <text id="spoke-6-label" x="120" y="166" text-anchor="middle" class="hs-spoke-label">Service F</text>
  </g>
  <!-- Bidirectional arrows: Hub <-> Spoke 6 -->
  <line x1="224" y1="265" x2="176" y2="185" class="hs-connector" marker-end="url(#hs-arrow)" />
  <line x1="180" y1="180" x2="228" y2="270" class="hs-connector" marker-end="url(#hs-arrow)" />
  <text id="spoke-6-arrow-label" x="185" y="218" text-anchor="middle" class="hs-arrow-label"></text>

  <!-- Spoke 7 (hidden) -->
  <g id="spoke-7-group" style="display:none;">
    <rect class="hs-box" x="420" y="245" width="120" height="50" rx="8" ry="8"
          fill="var(--diagram-primary, #4A90D9)" filter="url(#hs-shadow)" />
    <text id="spoke-7-label" x="480" y="276" text-anchor="middle" class="hs-spoke-label">Service G</text>
  </g>

  <!-- Spoke 8 (hidden) -->
  <g id="spoke-8-group" style="display:none;">
    <rect class="hs-box" x="60" y="245" width="120" height="50" rx="8" ry="8"
          fill="var(--diagram-red, #DC5A5A)" filter="url(#hs-shadow)" />
    <text id="spoke-8-label" x="120" y="276" text-anchor="middle" class="hs-spoke-label">Service H</text>
  </g>
</svg>
