<svg viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Network security zones diagram with Internet, DMZ, and Internal zones separated by firewalls"
     id="network-zones-diagram">
  <title>Network Security Zones</title>
  <style>
    .nz-node { transition: filter 0.2s ease; cursor: pointer; }
    .nz-node:hover { filter: brightness(1.15) drop-shadow(0 3px 10px rgba(0,0,0,0.3)); }
    .nz-label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #fff; }
    .nz-zone-name { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: var(--diagram-text, #ccc); }
    .nz-fw-label { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: var(--diagram-text, #ccc); }
    .nz-connector { stroke: var(--diagram-arrow, #888); stroke-width: 2; }
  </style>

  <defs>
    <marker id="nz-arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--diagram-arrow, #888)" />
    </marker>
    <filter id="nz-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ==================== ZONE 1: INTERNET (red band) ==================== -->
  <rect x="10" y="20" width="780" height="110" rx="10" ry="10"
        fill="var(--diagram-red, #DC5A5A)" opacity="0.12" />
  <text id="zone-1-name" x="50" y="42" class="nz-zone-name">Internet</text>

  <g id="svc-1-group">
    <rect class="nz-node" x="160" y="50" width="140" height="45" rx="8" ry="8"
          fill="var(--diagram-red, #DC5A5A)" filter="url(#nz-shadow)" />
    <text id="svc-1-label" x="230" y="78" text-anchor="middle" class="nz-label">CDN</text>
  </g>

  <g id="svc-2-group">
    <rect class="nz-node" x="420" y="50" width="140" height="45" rx="8" ry="8"
          fill="var(--diagram-red, #DC5A5A)" filter="url(#nz-shadow)" />
    <text id="svc-2-label" x="490" y="78" text-anchor="middle" class="nz-label">DNS</text>
  </g>

  <g id="svc-3-group" style="display:none;">
    <rect class="nz-node" x="630" y="50" width="140" height="45" rx="8" ry="8"
          fill="var(--diagram-red, #DC5A5A)" filter="url(#nz-shadow)" />
    <text id="svc-3-label" x="700" y="78" text-anchor="middle" class="nz-label">WAF</text>
  </g>

  <!-- ==================== FIREWALL 1 ==================== -->
  <line x1="40" y1="140" x2="760" y2="140" stroke="var(--diagram-arrow, #888)"
        stroke-width="1.5" stroke-dasharray="8,4" />
  <!-- Shield icon (simplified) -->
  <path d="M395,133 L400,128 L405,133 L405,142 C405,145 400,148 400,148 C400,148 395,145 395,142 Z"
        fill="var(--diagram-amber, #F5A623)" stroke="none" />
  <text id="fw-1-label" x="420" y="148" class="nz-fw-label">Firewall 1</text>

  <!-- ==================== ZONE 2: DMZ (amber band) ==================== -->
  <rect x="10" y="150" width="780" height="110" rx="10" ry="10"
        fill="var(--diagram-amber, #F5A623)" opacity="0.12" />
  <text id="zone-2-name" x="50" y="172" class="nz-zone-name">DMZ</text>

  <g id="svc-4-group">
    <rect class="nz-node" x="160" y="180" width="140" height="45" rx="8" ry="8"
          fill="var(--diagram-amber, #F5A623)" filter="url(#nz-shadow)" />
    <text id="svc-4-label" x="230" y="208" text-anchor="middle" class="nz-label">Load Balancer</text>
  </g>

  <g id="svc-5-group">
    <rect class="nz-node" x="420" y="180" width="140" height="45" rx="8" ry="8"
          fill="var(--diagram-amber, #F5A623)" filter="url(#nz-shadow)" />
    <text id="svc-5-label" x="490" y="208" text-anchor="middle" class="nz-label">Reverse Proxy</text>
  </g>

  <g id="svc-6-group" style="display:none;">
    <rect class="nz-node" x="630" y="180" width="140" height="45" rx="8" ry="8"
          fill="var(--diagram-amber, #F5A623)" filter="url(#nz-shadow)" />
    <text id="svc-6-label" x="700" y="208" text-anchor="middle" class="nz-label">API Gateway</text>
  </g>

  <!-- ==================== FIREWALL 2 ==================== -->
  <line x1="40" y1="270" x2="760" y2="270" stroke="var(--diagram-arrow, #888)"
        stroke-width="1.5" stroke-dasharray="8,4" />
  <!-- Shield icon (simplified) -->
  <path d="M395,263 L400,258 L405,263 L405,272 C405,275 400,278 400,278 C400,278 395,275 395,272 Z"
        fill="var(--diagram-secondary, #50C878)" stroke="none" />
  <text id="fw-2-label" x="420" y="278" class="nz-fw-label">Firewall 2</text>

  <!-- ==================== ZONE 3: INTERNAL (green band) ==================== -->
  <rect x="10" y="280" width="780" height="110" rx="10" ry="10"
        fill="var(--diagram-secondary, #50C878)" opacity="0.12" />
  <text id="zone-3-name" x="50" y="302" class="nz-zone-name">Internal</text>

  <g id="svc-7-group">
    <rect class="nz-node" x="160" y="310" width="140" height="45" rx="8" ry="8"
          fill="var(--diagram-secondary, #50C878)" filter="url(#nz-shadow)" />
    <text id="svc-7-label" x="230" y="338" text-anchor="middle" class="nz-label">App Server</text>
  </g>

  <g id="svc-8-group">
    <rect class="nz-node" x="420" y="310" width="140" height="45" rx="8" ry="8"
          fill="var(--diagram-secondary, #50C878)" filter="url(#nz-shadow)" />
    <text id="svc-8-label" x="490" y="338" text-anchor="middle" class="nz-label">Database</text>
  </g>

  <g id="svc-9-group" style="display:none;">
    <rect class="nz-node" x="630" y="310" width="140" height="45" rx="8" ry="8"
          fill="var(--diagram-secondary, #50C878)" filter="url(#nz-shadow)" />
    <text id="svc-9-label" x="700" y="338" text-anchor="middle" class="nz-label">Cache</text>
  </g>

  <!-- ==================== TRAFFIC ARROWS (vertical, crossing zones) ==================== -->
  <!-- CDN -> Load Balancer -->
  <line x1="230" y1="95" x2="230" y2="178" class="nz-connector" marker-end="url(#nz-arrow)" />
  <!-- DNS -> Reverse Proxy -->
  <line x1="490" y1="95" x2="490" y2="178" class="nz-connector" marker-end="url(#nz-arrow)" />
  <!-- Load Balancer -> App Server -->
  <line x1="230" y1="225" x2="230" y2="308" class="nz-connector" marker-end="url(#nz-arrow)" />
  <!-- Reverse Proxy -> Database -->
  <line x1="490" y1="225" x2="490" y2="308" class="nz-connector" marker-end="url(#nz-arrow)" />
</svg>
