name: Validate evals

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate behavior evals
        run: python3 skills/slide-sage/scripts/run-evals
      - name: Validate the metrics example source
        run: skills/slide-sage/scripts/validate skills/slide-sage/examples/metrics-review.html
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the render browser
        run: |
          npm install --global playwright@1.58.0
          playwright install --with-deps chromium
      - name: Render representative slides at reference and short viewports
        run: |
          skills/slide-sage/scripts/render-check --slide 3 --viewport-size 1123,794 skills/slide-sage/examples/metrics-review.html artifacts/metrics-chart-reference.png
          skills/slide-sage/scripts/render-check --slide 3 --viewport-size 1123,500 skills/slide-sage/examples/metrics-review.html artifacts/metrics-chart-short.png
          skills/slide-sage/scripts/render-check --slide 2 --viewport-size 1123,794 skills/slide-sage/examples/architecture-teaching.html artifacts/architecture-diagram-reference.png
          skills/slide-sage/scripts/render-check --slide 2 --viewport-size 1123,500 skills/slide-sage/examples/architecture-teaching.html artifacts/architecture-diagram-short.png
          skills/slide-sage/scripts/render-check --slide 3 --viewport-size 1123,794 skills/slide-sage/examples/slide-sage-intro.html artifacts/intro-code-reference.png
          skills/slide-sage/scripts/render-check --slide 3 --viewport-size 1123,500 skills/slide-sage/examples/slide-sage-intro.html artifacts/intro-code-short.png
      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: representative-slide-renders
          path: artifacts/*.png
          if-no-files-found: ignore
