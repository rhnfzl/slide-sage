name: Validate evals

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate behavior evals
        run: python3 scripts/run-evals
      - name: Validate the metrics example source
        run: scripts/validate examples/metrics-review.html
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the render browser
        run: |
          npm install --global playwright@1.58.0
          playwright install --with-deps chromium
      - name: Render the metrics chart at reference and short viewports
        run: |
          scripts/render-check --slide 3 --viewport-size 1123,794 examples/metrics-review.html artifacts/metrics-chart-reference.png
          scripts/render-check --slide 3 --viewport-size 1123,500 examples/metrics-review.html artifacts/metrics-chart-short.png
      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-chart-render
          path: artifacts/metrics-chart-*.png
          if-no-files-found: ignore
